{% extends "accounts/_auth_base.html" %}

{% block title %}登录 · 知迹{% endblock %}

{% block auth_content %}
<h1 style="font-size: 1.7rem">欢迎回来</h1>
<p class="muted small mt-1 mb-3">继续记录你的学习。</p>

{% if error %}
<div class="toast toast--error mb-2" style="position: static">
  <div>{{ error }}</div>
</div>
{% endif %}

<form method="post" class="stack">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}" />
  <div class="field">
    <label class="label" for="username">用户名</label>
    <input
      class="input"
      id="username"
      name="username"
      autocomplete="username"
      required
      autofocus
      placeholder="你的用户名"
    />
  </div>
  <div class="field">
    <label class="label" for="password">密码</label>
    <input
      class="input"
      id="password"
      type="password"
      name="password"
      autocomplete="current-password"
      required
      placeholder="••••••••"
    />
  </div>
  <button class="btn btn--primary btn--lg btn--block" type="submit">登录</button>
</form>

<p class="small muted mt-3 center">
  还没有账号？<a href="{% url 'accounts:register' %}" class="strong">免费注册</a>
</p>
{% endblock %}
